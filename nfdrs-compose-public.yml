version: "3"

services:
  wwao-api:
    image: localhost/wwao-viewer_wwao-api:latest
    container_name: wwao-api
    ports:
      - "81"
    volumes:
      ## data api
      - ./api/app.py:/app/app.py:ro,Z
      ## database
      - ./data/wwao-dashboard.zarr:/app/wwao-dashboard.zarr:Z
    environment:
      - LOG_LEVEL=info
      - UVICORN_ACCESS_LOG=true
      - REDIS_URL=redis://wwao-apicache:6379
    networks:
      - wwao-backend

  wwao-apicache:
    image: docker.io/redis:8-alpine
    container_name: wwao-apicache
    networks:
     - wwao-backend

  wwao-basemap:
    image: ghcr.io/maplibre/martin:latest
    container_name: wwao-basemap
    volumes:
      - ./basemap:/data:ro
    command: ["--config", "/data/config.yaml"]
    expose:
      - "3000"
    networks:
      - wwao-backend

  wwao-dashboard:
    image: nginx:1.28.0
    container_name: wwao-dashboard
    ports:
      - "18085:80"
    ## mount data and html directories
    volumes:
      - ./dashboard:/usr/share/nginx/html:Z
      - ./dashboard/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    tmpfs:
      - /var/cache/nginx/wwao_data_cache:rw,noexec,nosuid,size=512m

    depends_on:
      - wwao-api
    networks:
      - wwao-backend

networks:
  wwao-backend:
    driver: bridge
    enable_ipv6: false
