version: "3"

services:
  nfdrs-api:
    image: localhost/nfdrs-viewer_nfdrs-api:latest
    container_name: nfdrs-api
    ports:
      - "81"
    volumes:
      ## data api
      - ./api/app.py:/app/app.py:ro,Z
      ## database
      - ./data/store/nfdrs-forecast.zarr:/app/nfdrs-forecast.zarr:Z
    environment:
      - LOG_LEVEL=info
      - UVICORN_ACCESS_LOG=true
      - REDIS_URL=redis://nfdrs-apicache:6379
    networks:
      - nfdrs-backend

  nfdrs-apicache:
    image: docker.io/redis:8-alpine
    container_name: nfdrs-apicache
    networks:
     - nfdrs-backend

  nfdrs-basemap:
    image: ghcr.io/maplibre/martin:latest
    container_name: nfdrs-basemap
    volumes:
      - ./basemap:/data:ro
    command: ["--config", "/data/config.yaml"]
    expose:
      - "3000"
    networks:
      - nfdrs-backend

  nfdrs-dashboard:
    image: nginx:1.28.0
    container_name: nfdrs-dashboard
    ports:
      - "18086:80"
    platform: linux/arm64/v8
    ## mount data and html directories
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro,z
      - ./dashboard/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./data/store/nfdrs-forecast.zarr:/usr/share/nginx/html/nfdrs-forecast.zarr/:ro,z
    tmpfs:
      - /var/cache/nginx/nfdrs_data_cache:rw,noexec,nosuid,size=512m

    depends_on:
      - nfdrs-api
    networks:
      - nfdrs-backend

networks:
  nfdrs-backend:
    driver: bridge
    enable_ipv6: false
